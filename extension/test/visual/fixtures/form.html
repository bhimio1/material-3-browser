<!doctype html><html><head><meta charset="utf-8"><title>Form</title>
<style>
body{margin:0;background:#eef1f5;font:15px system-ui,sans-serif;color:#1d2433}
.panel{max-width:520px;margin:40px auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:28px}
h2{margin-top:0}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
input[type=text],input[type=email],select,textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #c5ccd6;border-radius:6px;background:#fff;font:inherit}
.row{display:flex;gap:16px;align-items:center;margin-top:12px}
button{background:#2d6cdf;color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600}
button.secondary{background:#e3e8ef;color:#1d2433}
.err{color:#c62828;font-size:13px}
</style></head><body>
<div class="panel"><h2>Create account</h2>
<label>Name</label><input type="text" value="Bhima">
<label>Email</label><input type="email" placeholder="you@example.com">
<p class="err">Please enter an email address.</p>
<label>Distribution</label><select><option>Arch Linux</option><option>CachyOS</option></select>
<label>About you</label><textarea rows="3">Hyprland user.</textarea>
<div class="row"><label style="margin:0;font-weight:400"><input type="checkbox" checked> Subscribe</label>
<label style="margin:0;font-weight:400"><input type="radio" checked name="r"> Monthly</label>
<input type="range" value="60"></div>
<div class="row"><button>Sign up</button><button class="secondary">Cancel</button></div>
</div></body></html>
