[package]
name = "material_3_browser"
version = "0.1.0"
edition = "2021"
description = "Material 3 Browser: a Zen/Firefox distribution themed with Material You"
license = "MIT"

[[bin]]
name = "m3-browser"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }
material-colors = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = "2.12"
base64 = "0.22"
notify = "6"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
